<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${pageTitle}">Page Two</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;padding:1rem}</style>
</head>
<body>
  <h1 th:text="${pageTitle}">Page Two</h1>
  <p th:text="${message}">Welcome</p>
  <p><a th:href="@{/}">Back to Home</a></p>

  <button id="callApiBtn">Call API</button>
  <p id="apiResult" aria-live="polite"></p>

  <script>
    (function() {
      var btn = document.getElementById('callApiBtn');
      var out = document.getElementById('apiResult');
      btn.addEventListener('click', function() {
        btn.disabled = true;
        out.textContent = 'Calling API...';
        fetch('/get?name=' + encodeURIComponent('Chuck Norris'))
          .then(function(res) { return res.text(); })
          .then(function(text) { out.textContent = text; })
          .catch(function() { out.textContent = 'Error calling API'; })
          .finally(function() { btn.disabled = false; });
      });
    })();
  </script>
</body>
</html>
