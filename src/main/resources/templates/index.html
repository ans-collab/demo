<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <style>
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #pageTitle {
      margin: 0 0 1rem;
      font-size: 3rem; 
    }
    #msg { 
      margin: 0 0 2rem;
      font-size: 2rem;
    }
     .actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }
    .actions button {
      min-width: 10rem;
      padding: 1rem 2rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1.25rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${pageTitle}">Cheesy Jokes Corner</title>
  <script>
    function callGetJokes(jokeType,uri) {
      console.log("calling getJokes.." + jokeType);
      window.location.href = "/getJokes?jokeType=" + jokeType ;
    }
  </script>
</head>
<body>
  <p id="pageTitle" th:text="${pageTitle}">Loading...</p>
  <p id="msg" th:text="${msg}">Loading...</p>
  <div class="actions"> 
    <button 
      type="button"
      th:each="jokeType : ${jokeTypes}"
      th:text="${jokeType.displayName}"
      th:data-type="${jokeType.type}"
      th:onclick="callGetJokes(this.dataset.type)"
    >
    </button>
  </div>
</body>
</html>
