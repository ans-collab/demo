- name: Run JAR on Linux EC2 via SSH
  uses: appleboy/ssh-action@master
  with:
    host: ${{ secrets.EC2_HOST }}
    username: ${{ secrets.EC2_USERNAME }}
    key: ${{ secrets.EC2_SSH_KEY }}
    port: 22
    script: |
      # ... existing code ...
      sleep 3
      if pgrep -f "demo-0.0.1-SNAPSHOT.jar" > /dev/null; then
        echo "Application successfully running in background."
        echo "=== App Log (tail) ==="
        tail -20 app.log  # Add this to see what's happening
      else
        echo "ERROR: Application failed to start. Check app.log for details."
        cat app.log
        exit 1
      fi
