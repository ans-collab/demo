# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

permissions:
  contents: write
  packages: write
  security-events: write

on:
  push:
    branches: [ "main" ]
  pull_request_target:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: demo-jar
        path: target/*.jar

    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: demo-jar
        path: target/

    - name: Copy JAR to Linux EC2 via SSH
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        source: "target/*.jar"
        target: "/home/${{ secrets.EC2_USERNAME }}/app"
        strip_components: 1

    - name: Run JAR on Linux EC2 via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          # Install Java if not already installed
          if ! command -v java &> /dev/null; then
            echo "Installing Java..."
            sudo yum update -y
            sudo yum install -y java-26-amazon-corretto
          fi
          
          java -version
          
          cd /home/${{ secrets.EC2_USERNAME }}/app

          # 1.1. Find the actual JAR file name
          JAR_FILE=$(ls *.jar 2>/dev/null | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No JAR files found in $(pwd)"
            exit 1
          fi

          echo "Found JAR: $JAR_FILE"
          
          # 1. Stop the old process
          #echo "Stopping old process"
          #pkill -f "demo-0.0.1-SNAPSHOT.jar" || true

          #sleep 5

           #if pgrep -f "demo-0.0.1-SNAPSHOT.jar" > /dev/null; then
            # echo "Application still running. Force killing.."
             #pkill -9 -f "demo-0.0.1-SNAPSHOT.jar"  || true
           #fi  

          
          #PID=$(pgrep -f "demo-0.0.1-SNAPSHOT.jar")
          #if [ -n "$PID" ]; then
            #echo "Stopping old process $PID"
            #kill -15 $PID
            #echo "Killed: process $PID"
            #sleep 5
           # echo "sleep 5"
           # fi
          
          # 2. Start the new process completely detached from the shell
          #echo "Launching new JAR..."
          #BUILD_ID=dontKillMe nohup java -jar demo-0.0.1-SNAPSHOT.jar > app.log 2>&1 &

          echo "Found JAR: $JAR_FILE"
          
          # Restart the systemd service
          echo "Restarting demo service..."
          sudo systemctl restart demo
          
      
          # 3. Give it 3 seconds to spin up and verify it didn't crash instantly
          sleep 3
          if pgrep -f "demo-0.0.1-SNAPSHOT.jar" > /dev/null; then
            echo "Application successfully running in background."
          else
            echo "ERROR: Application failed to start. Check app.log for details."
            cat app.log
            exit 1
          fi
